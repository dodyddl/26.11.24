<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>해부생리 스터디 UI</title><style>body{margin:24px auto;padding:0 12px;max-width:1024px;background:#f5f8fc}#anatomy-study-redesign .study-settings{display:grid;gap:7px;min-width:0}
#anatomy-study-redesign .study-settings label{font-size:13px;font-weight:700}
#anatomy-study-redesign .study-settings select{min-width:0;width:100%;min-height:44px;border:1px solid #cad8e8;border-radius:10px;background:white;color:var(--navy);padding:6px 8px;font:inherit}
#anatomy-study-redesign .study-settings button{margin-top:5px}
#anatomy-study-redesign .study-feedback figure img{max-height:none}
#anatomy-study-redesign [data-prompt]{white-space:pre-line}
@media(max-width:640px){
  #anatomy-study-redesign .study-rail{grid-template-columns:1fr}
  #anatomy-study-redesign .study-settings{grid-template-columns:1fr 1fr}
  #anatomy-study-redesign #study-unit{grid-area:2 / 1}
  #anatomy-study-redesign #study-level{grid-area:2 / 2}
  #anatomy-study-redesign [data-reset]{grid-column:1 / -1}
}
</style></head><body>
<div id="anatomy-study-redesign" lang="ko">
  <div class="study-window">
    <header class="study-top">
      <div class="study-brand"><span class="study-logo"><span aria-hidden="true">✦</span></span><strong>해부생리 스터디</strong></div>
      <button type="button" class="study-back" data-restart hidden>학습 설정</button>
    </header>
    <div class="study-layout">
      <aside class="study-rail" aria-label="학습 진행">
        <div class="study-settings">
          <label for="study-unit">학습 단원</label>
          <select id="study-unit"><option>전체 단원</option><option>특수감각계통</option><option>신경생리</option><option>중추신경계통</option></select>
          <label for="study-level">난이도</label>
          <select id="study-level"><option>혼합</option><option>상</option><option>중</option><option>하</option></select>
          <button type="button" class="study-back" data-reset>다시 설정</button>
        </div>
        <div class="study-progress">
          <div><strong>이번 세트</strong><span data-progress>0 / 10 완료</span></div>
          <progress max="10" value="0" aria-label="이번 세트에서 푼 문제"></progress>
          <div class="study-steps" aria-hidden="true"></div>
        </div>
      </aside>
      <section class="study-content" aria-label="문제와 해설">
        <div class="study-meta"><span data-topic>신경계 발생</span><span data-level>난이도 하</span><span class="study-position" data-position>06 / 10</span></div>
        <h2 data-prompt></h2>
        <div class="study-options" role="group" aria-label="답안 선택"></div>
        <div class="study-feedback" aria-live="polite"></div>
        <div class="study-actions"><button class="study-back" type="button" data-previous hidden>← 이전 문제</button><button class="study-primary" type="button" data-next hidden>다음 문제 <span aria-hidden="true">→</span></button></div>
      </section>
    </div>
  </div>
</div>
<style>
#anatomy-study-redesign{--navy:#172a49;--body:#263853;--muted:#53657d;--line:#e1e8f0;--mint:#e9f7f0;--green:#155b47;--peach:#fff3eb;--rust:#8b4327;font:15px/1.55 system-ui,sans-serif;color:var(--navy);color-scheme:light;word-break:keep-all}
#anatomy-study-redesign *{box-sizing:border-box}
#anatomy-study-redesign [hidden]{display:none!important}
#anatomy-study-redesign .study-window{background:white;border:1px solid var(--line);border-radius:24px;overflow:hidden}
#anatomy-study-redesign .study-top{min-height:68px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px clamp(14px,4vw,30px);border-bottom:1px solid var(--line)}
#anatomy-study-redesign .study-brand,#anatomy-study-redesign .study-course{display:flex;align-items:center;gap:11px}
#anatomy-study-redesign .study-logo,#anatomy-study-redesign .study-course-icon{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:13px;background:var(--navy);color:white}
#anatomy-study-redesign .study-course-icon{background:#dcecff;color:#254e78}
#anatomy-study-redesign .study-layout{display:grid;grid-template-columns:minmax(192px,25%) minmax(0,1fr)}
#anatomy-study-redesign .study-rail{background:#f5f8fc;border-right:1px solid var(--line);padding:clamp(14px,3vw,26px);display:grid;align-content:start;gap:26px}
#anatomy-study-redesign .study-course small,#anatomy-study-redesign .study-course strong{display:block}
#anatomy-study-redesign .study-course small{color:var(--muted)}
#anatomy-study-redesign .study-progress{display:grid;gap:9px}
#anatomy-study-redesign .study-progress>div:first-child{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
#anatomy-study-redesign progress{appearance:none;border:0;border-radius:999px;height:7px;width:100%;background:#e1e9f4;overflow:hidden}
#anatomy-study-redesign progress::-webkit-progress-bar{background:#e1e9f4}
#anatomy-study-redesign progress::-webkit-progress-value{background:#4879b1;border-radius:999px}
#anatomy-study-redesign progress::-moz-progress-bar{background:#4879b1;border-radius:999px}
#anatomy-study-redesign .study-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
#anatomy-study-redesign .study-steps span{display:grid;place-items:center;min-height:23px;border-radius:6px;color:var(--muted);font-size:11px}
#anatomy-study-redesign .study-steps [data-state="done"]{background:#e3edf9;color:#234669}
#anatomy-study-redesign .study-steps [data-state="current"]{background:var(--navy);color:white}
#anatomy-study-redesign .study-content{padding:clamp(16px,4vw,33px);display:grid;gap:14px;min-width:0}
#anatomy-study-redesign .study-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#anatomy-study-redesign .study-meta span{padding:3px 10px;background:#eef3fa;border-radius:999px;color:#365577;font-weight:650;font-size:12px}
#anatomy-study-redesign .study-meta .study-position{margin-inline-start:auto;background:transparent;font-variant-numeric:tabular-nums}
#anatomy-study-redesign h2{margin:0 0 5px;font-size:clamp(20px,3.6vw,29px);letter-spacing:-.045em;line-height:1.38;color:var(--navy)}
#anatomy-study-redesign .study-options{display:grid;gap:8px}
#anatomy-study-redesign button{font:inherit;min-height:44px;color:inherit;cursor:pointer}
#anatomy-study-redesign .study-option{width:100%;display:flex;align-items:center;gap:11px;padding:8px 12px;background:white;border:1px solid var(--line);border-radius:13px;text-align:left}
#anatomy-study-redesign .study-option:not([aria-disabled]):hover{background:#f4f8fd;border-color:#a6beda}
#anatomy-study-redesign .study-key{display:grid;place-items:center;flex:0 0 28px;height:28px;background:#eff4fa;color:#355577;font-weight:750;font-size:12px;border-radius:9px}
#anatomy-study-redesign .study-status{margin-inline-start:auto;white-space:nowrap;font-size:12px;font-weight:750}
#anatomy-study-redesign .study-option[data-state="correct"]{background:var(--mint);border-color:#9bcdb7;color:var(--green)}
#anatomy-study-redesign .study-option[data-state="correct"] .study-key{background:#ccebdc;color:var(--green)}
#anatomy-study-redesign .study-option[data-state="wrong"]{background:var(--peach);border-color:#edc2ab;color:var(--rust)}
#anatomy-study-redesign .study-option[data-state="wrong"] .study-key{background:#f8dfd1;color:var(--rust)}
#anatomy-study-redesign .study-feedback{background:#f4f8fd;border-radius:16px;padding:14px 16px;display:grid;gap:7px;color:var(--body);animation:study-reveal .22s ease-out}
#anatomy-study-redesign .study-feedback:empty{display:none}
#anatomy-study-redesign .study-feedback strong{color:var(--navy);font-size:16px}
#anatomy-study-redesign p,#anatomy-study-redesign figure{margin:0}
#anatomy-study-redesign .study-concept{width:fit-content;background:#e1ecff;color:#2c507d;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
#anatomy-study-redesign figure img{display:block;width:100%;height:auto;max-height:225px;object-fit:contain;background:white;border-radius:10px;margin-top:4px}
#anatomy-study-redesign figcaption{color:var(--muted);margin-top:5px;font-size:12px}
#anatomy-study-redesign .study-back,#anatomy-study-redesign .study-primary{padding:8px 15px;border-radius:11px;font-weight:700}
#anatomy-study-redesign .study-back{border:1px solid var(--line);background:white}
#anatomy-study-redesign .study-primary{border:1px solid transparent;background:var(--navy);color:white}
#anatomy-study-redesign .study-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
#anatomy-study-redesign .study-actions:not(:has(> button:not([hidden]))){display:none}
@keyframes study-reveal{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#anatomy-study-redesign .study-feedback{animation:none}}
@media(max-width:640px){
  #anatomy-study-redesign .study-layout{grid-template-columns:1fr}
  #anatomy-study-redesign .study-rail{grid-template-columns:1fr 1fr;align-items:center;gap:12px;border-right:0;border-bottom:1px solid var(--line)}
  #anatomy-study-redesign .study-steps{display:none}
}
@media(max-width:370px){
  #anatomy-study-redesign .study-rail{grid-template-columns:1fr}
  #anatomy-study-redesign .study-actions button{flex:1 1 auto}
}
#anatomy-study-redesign .study-settings{display:grid;gap:7px;min-width:0}
#anatomy-study-redesign .study-settings label{font-size:13px;font-weight:700}
#anatomy-study-redesign .study-settings select{min-width:0;width:100%;min-height:44px;border:1px solid #cad8e8;border-radius:10px;background:white;color:var(--navy);padding:6px 8px;font:inherit}
#anatomy-study-redesign .study-settings button{margin-top:5px}
#anatomy-study-redesign .study-feedback figure img{max-height:none}
#anatomy-study-redesign [data-prompt]{white-space:pre-line}
@media(max-width:640px){
  #anatomy-study-redesign .study-rail{grid-template-columns:1fr}
  #anatomy-study-redesign .study-settings{grid-template-columns:1fr 1fr}
  #anatomy-study-redesign #study-unit{grid-area:2 / 1}
  #anatomy-study-redesign #study-level{grid-area:2 / 2}
  #anatomy-study-redesign [data-reset]{grid-column:1 / -1}
}
</style>

  let current;
  let review = false;

  function loadScope() {
    review = false;
    const key = unit.value + '|' + level.value;
    if (!sessions.has(key)) {
      const pool = QUESTION_BANK.filter(q =>
        (unit.value === '전체 단원' || q.unit === unit.value) &&
        (level.value === '혼합' || q.level === level.value));
      const queue = level.value === '혼합' ? shuffle([
        ...weightedSet(pool.filter(q => q.level === '하'), 3, 2),
        ...weightedSet(pool.filter(q => q.level === '중'), 5, 3),
        ...weightedSet(pool.filter(q => q.level === '상'), 2, 1)
      ]) : weightedSet(pool, 10, 6);
      sessions.set(key, {queue, index: 0, answers: []});
    }
    current = sessions.get(key);
    render();
  }

  function weightedSet(entries, size, priorityCount) {
    const priority = shuffle(entries.filter(q => q.emphasis));
    const regular = shuffle(entries.filter(q => !q.emphasis));
    const chosen = [...priority.slice(0, priorityCount), ...regular.slice(0, size - priorityCount)];
    const used = new Set(chosen);
    return shuffle([...chosen, ...shuffle(entries.filter(q => !used.has(q))).slice(0, size - chosen.length)]);
  }
  function shuffle(entries) {
    const result = entries.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function progress() {
    const complete = current.answers.length;
    const size = current.queue.length;
    find('[data-progress]').textContent = complete + ' / ' + size + ' 완료';
    find('progress').max = size;
    find('progress').value = complete;
    find('[data-position]').textContent = Math.min(current.index + 1, size) + ' / ' + size;
    find('.study-steps').innerHTML = current.queue.map((_, i) => {
      const state = i === current.index ? 'current' : i < complete ? 'done' : '';
      return '<span data-state="' + state + '">' + (i + 1) + '</span>';
    }).join('');
  }

  function render() {
    progress();
    const question = current.queue[current.index];
    feedback.replaceChildren();
    next.hidden = true;
    previous.hidden = current.index === 0;
    options.replaceChildren();
    if (!question) {
      showResult();
      return;
    }
    find('[data-topic]').textContent = question.unit + ' · ' + question.topic;
    find('[data-level]').textContent = '난이도 ' + question.level;
    find('[data-prompt]').textContent = question.prompt;
    question.options.forEach((choice, i) => {
      const button = document.createElement('button');
      button.className = 'study-option';
      button.type = 'button';
      button.innerHTML = '<span class="study-key"></span><span></span><span class="study-status"></span>';
      button.children[0].textContent = i + 1;
      button.children[1].textContent = choice;
      button.addEventListener('click', () => {
        if (current.answers.length > current.index) return;
        current.answers.push(i);
        displayAnswer(question, i);
        progress();
      });
      options.append(button);
    });
    if (current.answers.length > current.index) displayAnswer(question, current.answers[current.index]);
  }

  function displayAnswer(question, picked) {
    options.querySelectorAll('button').forEach((button, i) => {
      button.setAttribute('aria-disabled', 'true');
      if (i === question.answer || i === picked) {
        const correct = i === question.answer;
        button.dataset.state = correct ? 'correct' : 'wrong';
        button.querySelector('.study-status').textContent = correct ? '✓ 정답' : '내 답';
      }
    });
    const correct = picked === question.answer;
    feedback.innerHTML = '<strong></strong><p></p><p class="study-concept"></p>';
    feedback.children[0].textContent = correct ? '정답이에요!' :
      '정답 · ' + (question.answer + 1) + '번 ' + question.options[question.answer];
    feedback.children[1].textContent = question.detail +
      (!correct && question.why?.[picked] ? '\n내가 고른 보기 · ' + question.why[picked] : '');
    feedback.children[1].style.whiteSpace = 'pre-line';
    feedback.children[2].textContent = '복습 개념 · ' + question.concept;
    if (question.unit === '중추신경계통' &&
        (question.topic === '신경계 발생' || question.concept === '신경관 형성')) {
      const image = document.createElement('figure');
      image.innerHTML = '<img alt="신경관 형성과 신경능선 세포의 분리 과정"><figcaption>강의 그림 · 신경관 형성과 신경능선</figcaption>';
      image.firstElementChild.src = figure;
      feedback.append(image);
    }
    next.textContent = current.index + 1 === current.queue.length ? '결과 보기 →' : '다음 문제 →';
    next.hidden = false;
  }

  function showResult() {
    find('[data-topic]').textContent = review ? '오답 복습' : unit.value;
    find('[data-level]').textContent = level.value;
    const misses = current.queue.filter((q, i) => q.answer !== current.answers[i]);
    find('[data-prompt]').textContent = current.queue.length + '문제 중 ' +
      (current.queue.length - misses.length) + '문제를 맞혔어요';
    if (!misses.length) return;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'study-primary';
    button.textContent = '틀린 문제 다시 풀기';
    button.addEventListener('click', () => {
      current = {queue: misses, index: 0, answers: []};
      review = true;
      render();
      options.querySelector('button')?.focus();
    });
    options.append(button);
  }

  previous.addEventListener('click', () => {
    if (current.index === 0) return;
    current.index--;
    render();
    if (previous.hidden) options.firstElementChild?.focus();
  });
  next.addEventListener('click', () => {
    if (current.answers.length <= current.index) return;
    current.index++;
    render();
    if (options.firstElementChild) options.firstElementChild.focus();
    else settings.focus();
  });
  unit.addEventListener('change', loadScope);
  level.addEventListener('change', loadScope);
  settings.hidden = false;
  settings.addEventListener('click', () => unit.focus());
  find('[data-reset]').addEventListener('click', () => {
    sessions.clear();
    unit.selectedIndex = 0;
    level.selectedIndex = 0;
    loadScope();
    unit.focus();
  });
  loadScope();
})();
</script>
</body></html>
